<html lang="fr">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2048FF">
<title>WEPUB – Contact</title>
<style>
:root { --wepub-blue: #2048FF; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 28px 16px;
  display: grid; place-items: center;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(145deg, #2048FF 0%, #1737D4 100%);
  color: #172033;
}
main {
  width: min(100%, 440px); background: #fff; border-radius: 24px;
  padding: 26px 22px 22px; box-shadow: 0 18px 55px rgba(0,0,0,.2);
}
.logo { display:block; width:min(68vw, 280px); aspect-ratio:1 / 1; height:auto; object-fit:contain; object-position:center center; background:var(--wepub-blue); margin:0 auto 18px; border-radius:50%; overflow:hidden; }
.brand { text-align:center; color:var(--wepub-blue); font-weight:900; font-size:42px; margin-bottom:18px; }
.brand span { display:block; font-size:17px; font-weight:700; }
h1 { color:var(--wepub-blue); text-align:center; font-size:23px; margin: 8px 0 5px; }
.subtitle { text-align:center; color:#687386; font-size:14px; margin:0 0 22px; }
.contact {
  display:flex; align-items:center; gap:14px; width:100%;
  padding:15px 16px; margin:10px 0; border:1.5px solid #dce3f5;
  border-radius:14px; background:#fff; color:var(--wepub-blue);
  text-decoration:none; font-weight:700;
  transition: background-color .22s ease, color .22s ease, border-color .22s ease, transform .22s ease, box-shadow .22s ease;
  -webkit-tap-highlight-color: transparent;
}
.contact svg { width:23px; height:23px; flex:0 0 23px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.contact .copy { display:flex; flex-direction:column; gap:3px; min-width:0; }
.contact small { font-size:12px; font-weight:400; opacity:.75; overflow-wrap:anywhere; }
.contact:hover, .contact:focus-visible, .contact:active {
  background:var(--wepub-blue); color:#fff; border-color:var(--wepub-blue);
  box-shadow:0 7px 18px rgba(32,72,255,.22); transform:translateY(-1px);
}
.contact:focus-visible { outline:3px solid #9db0ff; outline-offset:3px; }
footer { text-align:center; color:#7b8494; font-size:12px; line-height:1.6; margin-top:20px; }
@media (prefers-reduced-motion: reduce) { .contact { transition:none; } }
</style>
